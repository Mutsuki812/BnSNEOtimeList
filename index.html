<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>B&S NEO 時間表</title>

  <!-- 共通樣式 (所有裝置) -->
  <link rel="stylesheet" href="./style/common.css?v=20260513-1">

  <!-- 桌面版樣式 (僅寬度 >= 431px) -->
  <link rel="stylesheet" href="style/desktop.css" media="(min-width: 431px)">

  <!-- 手機版樣式 (僅寬度 <= 430px) -->
  <link rel="stylesheet" href="style/mobile.css" media="(max-width: 430px)">
  <link
    href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Kosugi+Maru&family=M+PLUS+1p:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>
  <div id="app">
    <!-- 日期與時間 -->
    <header id="topBar">
      <div id="topLeft">
        <div id="titleNotice" class="titleNotice"></div>
        <div id="dateLabel" class="dateLabel"></div>
        <div id="timeBox" class="timeBox"></div>
      </div>
    </header>

    <!-- 常態公告 -->
     <div id="titleNotice" class="titleNotice"></div>
    <!-- 特殊期間外公告 -->
    <div id="regularNotice" class="regularNotice"></div>
    <!-- 特殊期間內公告 -->
    <div id="temporaryNotice" class="temporaryNotice"></div>
    
    <div class="infoBar">
      <div class="userInfo"></div>
      <div class="bossSound"></div>
      <div class="dateInfo"></div>
    </div>

    <!-- 整個任務區 -->
    <section id="mainCard" class="mainCard">
      <!-- 任務列表 -->
      <div id="taskContainer" class="taskContainer">
        <!-- JS 將在這裡根據區域生成 .region-group 容器 -->
      </div>
    </section>

    <div class="thxsInfo" style="text-align: right; font-size:0.8rem; padding-right: 20px;">
      ※感謝每個熱心回報、提供修正的玩家 沒有你們就沒有這個時間表了！🙏 
    </div>

    <!-- 回報區 -->
    <div id="reportRoot"></div>
  </div>

  <script type="module" src="./script/main.js?v=20260513-1"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7ZDSL0ZW37"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }

    gtag('js', new Date());

    gtag('config', 'G-7ZDSL0ZW37');
    gtag('config', 'G-CMF0FG4JRV');
    gtag('config', 'G-MN9SG0GVBY');
  </script>

</body>

</html>
