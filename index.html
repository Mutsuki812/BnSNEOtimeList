<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>B&S NEO 時間表</title>

  <!-- 1. 載入共通樣式 (所有裝置) -->
  <link rel="stylesheet" href="style/common.css">

  <!-- 2. 載入桌面版樣式 (僅寬度 >= 432px) -->
  <link rel="stylesheet" href="style/desktop.css" media="(min-width: 432px)">

  <!-- 3. 載入手機版樣式 (僅寬度 <= 431px) -->
  <link rel="stylesheet" href="style/mobile.css" media="(max-width: 431px)">
  <link
    href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Kosugi+Maru&family=M+PLUS+1p:wght@700;800;900&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>
  <div id="app">
    <!-- 日期與時間 -->
    <header id="topBar">
      <div id="topLeft">
        <div id="dateLabel" class="dateLabel"></div>
        <div id="timeBox" class="timeBox"></div>
      </div>
      <!-- 切換按鈕 -->
      <div id="topRight">
        <button id="langBtn" class="langBtn"></button>
      </div>
    </header>

    <!-- 說明公告 -->
    <div id="regularNotice" class="regularNotice"></div>
    <!-- 限時公告 -->
    <div id="temporaryNotice" class="temporaryNotice"></div>
    
    <div class="infoBar">
      <button id="viewDailyBtn" class="viewDailyBtn" type="button">查看整日</button>
      <div class="dateInfo">※資料來源：<a href="https://forum.gamer.com.tw/C.php?bsn=12980&snA=79447" target="_blank">巴哈姆特</a></div>
    </div>

    <!-- 整個任務區 -->
    <section id="mainCard" class="mainCard">
      <!-- 任務列表 -->
      <div id="taskContainer" class="taskContainer"></div>
    </section>

    <div class="dateInfo" style="text-align: right; font-size:0.8rem; padding-right: 20px;">※感謝<a
        href="https://home.gamer.com.tw/profile/index.php?&owner=nobody9999" target="_blank">不起眼的路人</a>及各位巴哈使用者的時間地點提供
    </div>

    <!-- 回報區 -->
    <div id="reportRoot"></div>
  </div>

  <script src="./script/main.js" type="module"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7ZDSL0ZW37"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }

    gtag('js', new Date());

    gtag('config', 'G-7ZDSL0ZW37');
    gtag('config', 'G-CMF0FG4JRV');
    gtag('config', 'G-MN9SG0GVBY');
  </script>

</body>
</html>
